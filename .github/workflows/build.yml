name: Build

on:
  push:
    branches: [main, develop]
    tags: ['v*']
  pull_request:

# Read-only by default; only the release job (tags) may write.
permissions:
  contents: read

jobs:
  build:
    # Never run for pull requests from forks: outside code must be reviewed first.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: windows-latest
    # Every run waits for the environment's required reviewer to approve it.
    environment: ci
    steps:
      # Actions are pinned to full commit SHAs; Dependabot keeps them up to date.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '8.0.x'

      - name: Build and package
        shell: pwsh
        run: |
          # A tag like v1.2.3 sets the version; other builds use the project's version.
          $version = if ($env:REF_TYPE -eq 'tag') { $env:REF_NAME.TrimStart('v') } else { '' }
          ./tools/package.ps1 -Version $version
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: MarkLens-x64
          path: dist/*.zip

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write      # create the release
      id-token: write      # sign the build attestation
      attestations: write  # store the build attestation
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: MarkLens-x64
          path: dist

      # Signed proof that the zip was built by this workflow from this repository.
      # Verify a download with: gh attestation verify <zip> --repo maarten-grassmid/marklens
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*.zip

      # Release notes include the zip's SHA-256 and a ready-to-paste entry for the
      # Notepad++ Plugins Admin list (notepad-plus-plus/nppPluginList, src/pl.x64.json).
      - name: Write release notes
        env:
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          zip=$(ls dist/*.zip)
          name=$(basename "$zip")
          sha=$(sha256sum "$zip" | cut -d' ' -f1)
          version="${TAG#v}"
          cat > notes.md <<EOF
          ### Download

          \`$name\` (64-bit, Notepad++ 8.3.1 or later)

          SHA-256: \`$sha\`

          <details>
          <summary>Plugins Admin entry (pl.x64.json)</summary>

          \`\`\`json
          {
              "folder-name": "MarkLens",
              "display-name": "MarkLens",
              "version": "$version",
              "npp-compatible-versions": "[8.3.1,]",
              "id": "$sha",
              "repository": "https://github.com/$REPO/releases/download/$TAG/$name",
              "description": "Fast Markdown preview with table of contents, jump-to-source highlighting and two-way scroll sync.",
              "author": "Maarten Grassmid",
              "homepage": "https://github.com/$REPO"
          }
          \`\`\`
          </details>
          EOF
          cat notes.md

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: gh release create "$TAG" dist/*.zip --repo "$REPO" --title "MarkLens $TAG" --notes-file notes.md --generate-notes
