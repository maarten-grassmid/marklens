name: Pull request checks
run-name: "PR #${{ github.event.number }}: ${{ github.event.pull_request.title }} (by ${{ github.actor }})"

# Runs on every pull request. It has a read-only token and no secrets, so it cannot change
# the repository. Runs for pull requests from forks wait until the maintainer approves them
# (repository setting), and the approval banner shows this workflow's name and run title.
on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: pr-${{ github.event.number }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and smoke test
    runs-on: windows-latest
    steps:
      # Actions are pinned to full commit SHAs; Dependabot keeps them up to date.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/package
