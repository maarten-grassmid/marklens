name: Build and smoke test
description: Builds the plugin zip, smoke-tests it on Notepad++ 8.3.1 and uploads the zip and screenshot.

inputs:
  version:
    description: Version to stamp into the package (empty uses the project's version).
    required: false
    default: ''

runs:
  using: composite
  steps:
    - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
      with:
        dotnet-version: '8.0.x'

    - name: Build and package
      shell: pwsh
      # A tag like v1.2.3 becomes version 1.2.3. Not named VERSION: MSBuild reads environment
      # variables as properties, and Version=v1.2.3 would break the DllExporter restore.
      run: ./tools/package.ps1 -Version $env:RELEASE_TAG.TrimStart('v')
      env:
        RELEASE_TAG: ${{ inputs.version }}

    # Install the package into portable Notepad++ 8.3.1 (the oldest supported version),
    # open the sample and make sure the viewer comes up without logging an error.
    - name: Smoke test on Notepad++ 8.3.1
      shell: pwsh
      run: ./tools/smoke-test.ps1 -Zip (Get-Item dist/*.zip).FullName -Screenshot dist/smoke-test.png

    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: MarkLens-x64
        path: dist/*.zip

    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      if: always()
      with:
        name: smoke-test
        path: dist/smoke-test.png
        if-no-files-found: ignore
