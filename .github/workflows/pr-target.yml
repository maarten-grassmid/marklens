name: PR target

# main only receives releases merged from develop; everything else goes to develop first.
on:
  pull_request:
    branches: [main]

permissions: {}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Require develop as the source branch
        env:
          HEAD: ${{ github.event.pull_request.head.ref }}
          SAME_REPO: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
        run: |
          if [ "$SAME_REPO" = "true" ] && [ "$HEAD" = "develop" ]; then
            echo "ok: develop -> main"
            exit 0
          fi
          echo "::error::Pull requests to main are only accepted from the develop branch. Please retarget this pull request to develop."
          exit 1
