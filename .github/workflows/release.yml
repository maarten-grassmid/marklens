name: Release
run-name: "Release ${{ github.ref_name }}"

# Only the maintainer can push v* tags (tag ruleset). The build runs straight away; publishing
# waits for the maintainer to approve the "release" environment.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    name: Build and smoke test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The tag (v1.2.3) sets the version.
      - uses: ./.github/actions/package
        with:
          version: ${{ github.ref_name }}

  publish:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write      # create the release
      id-token: write      # sign the build attestation
      attestations: write  # store the build attestation
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: MarkLens-x64
          path: dist

      # Signed proof that the zip was built by this workflow from this repository.
      # Verify a download with: gh attestation verify <zip> --repo maarten-grassmid/marklens
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*.zip

      # Release notes include the zip's SHA-256 and a ready-to-paste entry for the
      # Notepad++ Plugins Admin list (notepad-plus-plus/nppPluginList, src/pl.x64.json).
      - name: Write release notes
        env:
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          zip=$(ls dist/*.zip)
          name=$(basename "$zip")
          sha=$(sha256sum "$zip" | cut -d' ' -f1)
          version="${TAG#v}"
          cat > notes.md <<NOTES
          ### Download

          \`$name\` (64-bit, Notepad++ 8.3.1 or later)

          SHA-256: \`$sha\`

          <details>
          <summary>Plugins Admin entry (pl.x64.json)</summary>

          \`\`\`json
          {
              "folder-name": "MarkLens",
              "display-name": "MarkLens",
              "version": "$version",
              "npp-compatible-versions": "[8.3.1,]",
              "id": "$sha",
              "repository": "https://github.com/$REPO/releases/download/$TAG/$name",
              "description": "Fast Markdown preview with table of contents, jump-to-source highlighting and two-way scroll sync.",
              "author": "Maarten Grassmid",
              "homepage": "https://github.com/$REPO"
          }
          \`\`\`
          </details>
          NOTES
          cat notes.md

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: gh release create "$TAG" dist/*.zip --repo "$REPO" --title "MarkLens $TAG" --notes-file notes.md --generate-notes
